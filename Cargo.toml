[package]
name = "kubilas"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
log = "0.4.29"
cgmath = "0.18.0"
png = "0.18.1"
pretty_env_logger = "0.5.0"
tobj = { version = "4.0.3", features = ["log"] }
vulkanalia = { version = "0.35.0", features = ["libloading", "provisional", "window"] }
winit = "0.30.13"
rand = "0.10.0"
vulkanalia-vma = "0.9.0"
egui = "0.33.3"
egui-winit = "0.33.3"
gltf = "1.4.1"

[profile.release]
opt-level = 3
